name: docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aroboticsteam/lightpoint

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Mirror to registry.kmnet.uk
        if: github.event_name != 'pull_request'
        env:
          MIRROR_USER: ${{ secrets.KMNET_REGISTRY_USERNAME }}
          MIRROR_PASS: ${{ secrets.KMNET_REGISTRY_PASSWORD }}
        run: |
          if [ -z "$MIRROR_USER" ] || [ -z "$MIRROR_PASS" ]; then
            echo "KMNET_REGISTRY_* secrets not set; skipping mirror"
            exit 0
          fi
          echo "$MIRROR_PASS" | docker login registry.kmnet.uk -u "$MIRROR_USER" --password-stdin
          docker buildx imagetools create -t registry.kmnet.uk/lightpoint:latest "$IMAGE:latest"
